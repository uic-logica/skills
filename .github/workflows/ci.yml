name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate marketplace and plugin manifests are valid JSON
        run: |
          jq empty .claude-plugin/marketplace.json
          jq empty .claude-plugin/plugin.json

      - name: Check every skill has a name and description
        run: |
          for f in skills/*/SKILL.md; do
            echo "Checking $f"
            grep -q '^name:' "$f" || { echo "missing 'name:' in $f"; exit 1; }
            grep -q '^description:' "$f" || { echo "missing 'description:' in $f"; exit 1; }
          done
